name: CI - Pipeline - Main
on:
  push:
    branches: [ "*" ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Update Maven
        run: sudo apt update && sudo apt install -y maven

      - name: Run Tests with Maven
        run: mvn test -Dspring.profiles.active=test -e -X

