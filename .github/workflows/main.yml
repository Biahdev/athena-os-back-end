name: CI - Pipeline - Main
on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches-ignore: ["main"]
  workflow_dispatch:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: ./mvnw test