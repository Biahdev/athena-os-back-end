spring.application.name=athena-os

# DB
spring.datasource.url=jdbc:mysql://localhost:3306/athenadb?useTimezone=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=bia
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Swagger
spring-doc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

front.url=http://localhost:4200

# Autentica��o
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
jwt.secret.admin=123
jwt.cookie.name=jwt_token
jwt.cookie.expiration=jwt_token

